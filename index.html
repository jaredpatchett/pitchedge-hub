<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitchEdge</title>
<meta name="theme-color" content="#0b0d10">
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel2:#171b21; --line:#222831;
    --text:#e6e8eb; --muted:#8a93a0; --dim:#5d6672;
    --brand:#4c8dff; --go:#22c55e; --warn:#f5a524; --bad:#ef4444;
    --hdr:52px; --bar:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  a{color:inherit}

  /* header */
  header{position:sticky;top:0;z-index:10;height:var(--hdr);display:flex;align-items:center;gap:18px;
    padding:0 16px;padding-left:max(16px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;letter-spacing:.14em;font-size:13px;white-space:nowrap;cursor:pointer}
  .brand b{color:var(--brand)}
  nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
  nav::-webkit-scrollbar{display:none}
  nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:600;font-size:13px;
    white-space:nowrap;display:flex;align-items:center;gap:7px}
  nav button:hover{color:var(--text);background:var(--panel)}
  nav button[aria-current="page"]{color:var(--text);background:var(--panel2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--go)} .dot.stale{background:var(--warn)} .dot.err{background:var(--bad)}

  /* overview */
  #overview{padding:20px 16px 40px;max-width:1200px;margin:0 auto}
  .ovhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px}
  .ovhead h1{font-size:18px;margin:0;font-weight:650}
  .ovhead .sub{color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-height:190px}
  .card.quiet{opacity:.72;min-height:0}
  .chead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .chead h2{margin:0;font-size:15px;font-weight:650}
  .pill{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.live{color:var(--go);border-color:rgba(34,197,94,.35)}
  .pill.stale{color:var(--warn);border-color:rgba(245,165,36,.35)}
  .pill.err{color:var(--bad);border-color:rgba(239,68,68,.35)}
  .upd{color:var(--muted);font-size:12px}
  .stats{display:flex;flex-wrap:wrap;gap:6px 18px}
  .stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .stat .v{font-size:15px;font-weight:650}
  .plays{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}
  .plays .ttl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .play{display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .play .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .play .r{color:var(--muted);white-space:nowrap}
  .play .g{color:var(--go);font-weight:700;margin-right:6px}
  .note{color:var(--muted);font-size:13px}
  .cfoot{margin-top:auto;display:flex;gap:8px}
  .btn{all:unset;cursor:pointer;font-size:12px;font-weight:650;padding:7px 11px;border-radius:6px;border:1px solid var(--line);color:var(--text);text-align:center}
  .btn:hover{background:var(--panel2)}
  .btn.primary{border-color:rgba(76,141,255,.45);color:#cfe0ff}
  .btn[disabled]{opacity:.4;cursor:default}

  /* sport view */
  #sport{display:none}
  .bar{height:var(--bar);display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .bar .name{font-weight:650;white-space:nowrap}
  .bar .upd,.bar .stats{white-space:nowrap;flex-wrap:nowrap}
  .bar .stat{display:flex;gap:6px;align-items:baseline}
  .bar .stat .v{font-size:13px}
  .bar .sp{flex:1}
  .frame{width:100%;height:calc(100dvh - var(--hdr) - var(--bar));border:0;display:block;background:var(--bg)}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);max-width:520px;margin:0 auto}
  .empty h2{color:var(--text);font-size:17px;margin:0 0 8px}
  @media (max-width:600px){ .grid{grid-template-columns:1fr} header{gap:10px} }
</style>
</head>
<body>
<header>
  <div class="brand" id="home">PITCH<b>EDGE</b></div>
  <nav id="tabs"></nav>
</header>

<main>
  <section id="overview">
    <div class="ovhead">
      <h1>All models</h1>
      <span class="sub" id="ovtime"></span>
    </div>
    <div class="grid" id="cards"></div>
  </section>
  <section id="sport">
    <div class="bar" id="bar"></div>
    <div id="view"></div>
  </section>
</main>

<script>
/* ===================== SPORTS — edit this list =====================
   mode:  'auto'      = status comes from how fresh the data is
          'offseason' = shows OFF SEASON (set back to 'auto' when it starts)
          'onhold'    = shows ON HOLD
          'coming'    = not built yet (no page to load)
   staleHours: how old the data can get before the dot turns amber
   =================================================================== */
const SPORTS = [
  { id:'cfb', name:'CFB', full:'College Football', mode:'auto', staleHours:30,
    url:'https://jaredpatchett.github.io/CFB-Model/dashboard.html',
    data:'https://raw.githubusercontent.com/jaredpatchett/CFB-Model/main/docs/data/card_log.json', load:loadCFB },
  { id:'cbb', name:'CBB', full:'College Basketball', mode:'auto', staleHours:20,
    url:'https://jaredpatchett.github.io/CBB-Model/dashboard.html',
    data:'https://raw.githubusercontent.com/jaredpatchett/CBB-Model/main/docs/data/latest.json', load:loadCBB },
  { id:'nfl', name:'NFL', full:'NFL', mode:'auto', staleHours:100,
    url:'https://nfl-model.jaredpatchettfit.workers.dev/',
    data:'https://raw.githubusercontent.com/jaredpatchett/NFL-Model/main/data/nfl_lines.json', load:loadNFL },
  { id:'nba', name:'NBA', full:'NBA', mode:'coming',
    note:'No NBA model yet. It will be built from the CBB engine and added here once it passes a backtest.' },
  { id:'golf', name:'Golf', full:'PGA Golf', mode:'offseason', staleHours:2,
    note:'Season over after the RSM Classic. Back in January.',
    url:'https://rods-golf-model.jaredpatchettfit.workers.dev/',
    data:'https://raw.githubusercontent.com/jaredpatchett/rods-golf-model/main/rods_data.json', load:loadGolf },
  { id:'soccer', name:'Soccer', full:'Soccer', mode:'onhold',
    note:'World Cup finished. Club leagues on hold since October.',
    url:'https://wc-7-dashboard.jaredpatchettfit.workers.dev/' },
];

/* ===================== helpers ===================== */
const TZ = 'America/Phoenix';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = {};   // id -> {status, updated, stats, plays, error}

function fmtWhen(d){
  if(!d || isNaN(d)) return '—';
  const now = new Date();
  const day = x => x.toLocaleDateString('en-US',{timeZone:TZ});
  const time = d.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
  if(day(d) === day(now)) return 'Today ' + time;
  const y = new Date(now - 864e5);
  if(day(d) === day(y)) return 'Yesterday ' + time;
  return d.toLocaleDateString('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'}) + ' ' + time;
}
function ago(d){
  const h = (Date.now() - d) / 36e5;
  if(h < 1) return Math.max(1, Math.round(h*60)) + 'm ago';
  if(h < 48) return Math.round(h) + 'h ago';
  return Math.round(h/24) + 'd ago';
}
function kick(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{timeZone:TZ,weekday:'short'}) + ' ' +
         d.toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
}
const sgn = x => (x > 0 ? '+' : '') + x;
async function getJSON(url){
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now()/6e4), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function store(k, v){ try{ v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

/* ===================== per-sport loaders =====================
   Each returns { updated: Date, stats: [[label, value], ...], plays: {title, rows:[{g,l,r}]} } */

async function loadCBB(s){
  const d = await getJSON(s.data);
  const now = Date.now();
  const all = [...(d.spreads||[]), ...(d.totals||[]), ...(d.props||[])];
  const live = all.filter(p => p.official && new Date(p.kickoff) > now);
  const aplays = live.filter(p => p.grade === 'A');
  const label = p => {
    if(p.market === 'spread'){ const t = p.side === 'home' ? p.home_cbbd : p.away_cbbd; return `${t} ${sgn(p.line)}`; }
    if(p.market === 'total') return `${p.away_cbbd} @ ${p.home_cbbd} ${p.side === 'over' ? 'O' : 'U'} ${p.line}`;
    return `${p.player} ${p.side === 'over' ? 'O' : 'U'} ${p.line} ${p.prop_market}`;
  };
  const rec = d.record && d.record.all;
  const stats = [['Official plays', live.length], ['A plays', aplays.length]];
  if(rec) stats.push(['Record', `${rec.w}-${rec.l}${rec.p ? '-' + rec.p : ''}`], ['Units', sgn(rec.units)], ['ROI', sgn(rec.roi) + '%']);
  return {
    updated: new Date(d.meta && d.meta.generated_at), stats,
    plays: { title: 'Upcoming A plays', rows: aplays.sort((a,b) => new Date(a.kickoff) - new Date(b.kickoff)).slice(0,5)
      .map(p => ({g:'A', l:label(p), r:kick(p.kickoff)})) }
  };
}

async function loadCFB(s){
  const d = await getJSON(s.data);
  const runs = d.runs || [];
  const last = runs[runs.length - 1] || {};
  const now = Date.now();
  const up = (last.plays || []).filter(p => new Date(p.kickoff) > now).sort((a,b) => new Date(a.kickoff) - new Date(b.kickoff));
  const stats = [['Bet Card', up.length]];
  if(up.length) stats.push(['Next kickoff', kick(up[0].kickoff)]);
  return {
    updated: new Date(last.at), stats,
    plays: { title: 'Bet Card spreads', rows: up.slice(0,5).map(p => ({l:p.label, r:Math.round(p.prob*100) + '% model'})) }
  };
}

async function loadNFL(s){
  const d = await getJSON(s.data);
  const g = d.games || [];
  const priced = g.filter(x => x.market_source && x.market_source !== 'schedule_fallback').length;
  return {
    updated: new Date(d.generated_at),
    stats: [['Week', d.week], ['Games', g.length], ['Live odds', g.length ? `${priced}/${g.length}` : '—']],
    plays: null
  };
}

async function loadGolf(s){
  const d = await getJSON(s.data);
  const m = d.meta || {};
  return {
    updated: new Date(String(m.generated || '').replace(' ', 'T') + 'Z'),
    stats: [['Last event', m.event || '—'], ['Field', m.players || '—']],
    plays: null
  };
}

/* ===================== status ===================== */
function statusOf(s, st){
  if(s.mode === 'coming') return ['COMING SOON', ''];
  if(s.mode === 'onhold') return ['ON HOLD', ''];
  if(s.mode === 'offseason') return ['OFF SEASON', ''];
  if(!st) return ['LOADING', ''];
  if(st.error) return ['NO DATA', 'err'];
  if(st.updated && (Date.now() - st.updated) / 36e5 > s.staleHours) return ['STALE', 'stale'];
  return ['LIVE', 'live'];
}

/* ===================== render ===================== */
function renderTabs(active){
  $('#tabs').innerHTML = ['<button data-id="" ' + (!active ? 'aria-current="page"' : '') + '>Overview</button>']
    .concat(SPORTS.map(s => {
      const cls = statusOf(s, state[s.id])[1];
      return `<button data-id="${s.id}" ${active === s.id ? 'aria-current="page"' : ''}><span class="dot ${cls}"></span>${esc(s.name)}</button>`;
    })).join('');
}

function statsHTML(st){
  return (st.stats || []).map(([k, v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v num">${esc(v)}</div></div>`).join('');
}

function cardHTML(s){
  const st = state[s.id];
  const [label, cls] = statusOf(s, st);
  const quiet = ['coming','onhold','offseason'].includes(s.mode);
  let body = '';
  if(s.note) body += `<div class="note">${esc(s.note)}</div>`;
  if(st && st.error) body += `<div class="note">Couldn't load the data file (${esc(st.error)}). The dashboard itself may still work.</div>`;
  if(st && !st.error){
    body += `<div class="stats">${statsHTML(st)}</div>`;
    if(st.plays && st.plays.rows.length){
      body += `<div class="plays"><div class="ttl">${esc(st.plays.title)}</div>` +
        st.plays.rows.map(p => `<div class="play"><span class="l">${p.g ? `<span class="g">${esc(p.g)}</span>` : ''}${esc(p.l)}</span><span class="r num">${esc(p.r)}</span></div>`).join('') + '</div>';
    } else if(st.plays){
      body += `<div class="plays"><div class="ttl">${esc(st.plays.title)}</div><div class="note">None right now.</div></div>`;
    }
  }
  const upd = st && st.updated && !isNaN(st.updated) ? `<span class="upd num" title="${esc(st.updated.toISOString())}">Updated ${fmtWhen(st.updated)} · ${ago(st.updated)}</span>` : '';
  const open = s.url ? `<button class="btn primary" data-open="${s.id}">Open ${esc(s.name)}</button><a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">New tab ↗</a>`
                     : `<button class="btn" disabled>Not built yet</button>`;
  return `<article class="card ${quiet ? 'quiet' : ''}">
    <div class="chead"><h2>${esc(s.full)}</h2><span class="pill ${cls}">${label}</span></div>
    ${upd}${body}
    <div class="cfoot">${open}</div></article>`;
}

function renderOverview(){
  $('#cards').innerHTML = SPORTS.map(cardHTML).join('');
  $('#ovtime').textContent = 'As of ' + fmtWhen(new Date()) + ' Arizona time';
}

function renderBar(s){
  const st = state[s.id];
  const [label, cls] = statusOf(s, st);
  const upd = st && st.updated && !isNaN(st.updated) ? `<span class="upd num">Updated ${fmtWhen(st.updated)}</span>` : '';
  const stats = st && !st.error ? `<div class="stats">${(st.stats||[]).map(([k,v]) => `<div class="stat"><span class="k">${esc(k)}</span><span class="v num">${esc(v)}</span></div>`).join('')}</div>` : '';
  $('#bar').innerHTML = `<span class="name">${esc(s.full)}</span><span class="pill ${cls}">${label}</span>${upd}${stats}<span class="sp"></span>` +
    (s.url ? `<button class="btn" id="reload">Reload</button><a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Full page ↗</a>` : '');
}

let current = null;
function show(id){
  const s = SPORTS.find(x => x.id === id);
  current = s ? s.id : null;
  renderTabs(current);
  if(!s){
    $('#overview').style.display = ''; $('#sport').style.display = 'none';
    renderOverview(); document.title = 'PitchEdge'; return;
  }
  $('#overview').style.display = 'none'; $('#sport').style.display = 'block';
  document.title = s.name + ' · PitchEdge';
  renderBar(s);
  const view = $('#view');
  if(!s.url){
    view.innerHTML = `<div class="empty"><h2>${esc(s.full)} isn't built yet</h2><p>${esc(s.note || '')}</p></div>`;
    return;
  }
  // keep each dashboard's iframe alive once opened, so switching tabs is instant
  view.querySelectorAll('iframe').forEach(f => f.style.display = 'none');
  view.querySelectorAll('.empty').forEach(e => e.remove());
  let f = view.querySelector(`iframe[data-id="${s.id}"]`);
  if(!f){
    f = document.createElement('iframe');
    f.className = 'frame'; f.dataset.id = s.id; f.title = s.full + ' dashboard';
    f.src = s.url; f.loading = 'eager';
    f.setAttribute('allow', 'clipboard-write');
    view.appendChild(f);
  }
  f.style.display = 'block';
}

function route(){ show(location.hash.replace('#', '')); store('pe_last', location.hash); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-id],[data-open],#home,#reload');
  if(!t) return;
  if(t.id === 'home'){ location.hash = ''; return; }
  if(t.id === 'reload'){ const f = document.querySelector(`iframe[data-id="${current}"]`); if(f) f.src = f.src; refresh(current); return; }
  location.hash = t.dataset.open || t.dataset.id || '';
});
window.addEventListener('hashchange', route);

async function refresh(only){
  await Promise.all(SPORTS.filter(s => s.load && (!only || s.id === only)).map(async s => {
    try{ state[s.id] = await s.load(s); }
    catch(err){ state[s.id] = {error: err.message || 'error'}; console.warn(s.id, err); }
    if(current === s.id) renderBar(s);
  }));
  renderTabs(current);
  if(!current) renderOverview();
}

if(!location.hash){ const last = recall('pe_last'); if(last) history.replaceState(null, '', last); }
route();
refresh();
setInterval(refresh, 10 * 60 * 1000);   // re-check every 10 minutes
</script>
</body>
</html>

# Rebuilds data/*.json from each model's public repo, then commits.
# Read-only toward the model repos: nothing is written back to them.
# No secrets needed (all source repos are public).
name: Refresh site data

on:
  schedule:
    - cron: "17 * * * *"    # hourly (GitHub may start it late)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        run: python scripts/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh site data [skip ci]"
            git push
          fi
